<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="E-FormationGN">
  <title>E-FormationGN</title>
  <defs>
    <linearGradient id="efg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Pictogramme : livre ouvert + play -->
  <g transform="translate(8 12)">
    <rect x="0" y="0" width="72" height="72" rx="14" fill="url(#efg-grad)"/>
    <!-- pages du livre -->
    <path d="M14 22 C 22 18, 32 18, 36 22 L 36 56 C 32 52, 22 52, 14 56 Z"
          fill="#FFFFFF" opacity="0.95"/>
    <path d="M58 22 C 50 18, 40 18, 36 22 L 36 56 C 40 52, 50 52, 58 56 Z"
          fill="#FFFFFF" opacity="0.78"/>
    <!-- play triangle -->
    <path d="M30 32 L 46 40 L 30 48 Z" fill="#1E3A8A"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(96 0)" font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="0" y="48" font-size="30" font-weight="700" fill="#0F172A" letter-spacing="-0.5">
      E-Formation<tspan fill="#2563EB">GN</tspan>
    </text>
    <text x="0" y="72" font-size="13" font-weight="500" fill="#475569" letter-spacing="0.4">
      Apprendre. Enseigner. Progresser.
    </text>
  </g>
</svg>
