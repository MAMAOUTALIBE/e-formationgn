# E-FormationGN — stack production VPS Hostinger.
# Usage : `docker compose up -d --build`
# Domaine + secrets définis dans .env (cf. .env.production.example).

name: eformationgn

services:
  # -------- Reverse proxy + HTTPS automatique (Let's Encrypt) --------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web

  # -------- Application Next.js --------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eformationgn-app:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-E-FormationGN}

      # OAuth (optionnel)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

      # Mux
      MUX_TOKEN_ID: ${MUX_TOKEN_ID:-}
      MUX_TOKEN_SECRET: ${MUX_TOKEN_SECRET:-}
      MUX_WEBHOOK_SECRET: ${MUX_WEBHOOK_SECRET:-}

      # Resend
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}

      # Stockage R2 (optionnel)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-e-formationgn}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

      # Sentry (optionnel)
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}

      # Tuteur IA (optionnel)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Plateforme
      PLATFORM_DEFAULT_CURRENCY: ${PLATFORM_DEFAULT_CURRENCY:-EUR}
      PLATFORM_COMMISSION_INSTRUCTOR_BPS: ${PLATFORM_COMMISSION_INSTRUCTOR_BPS:-1500}
      PLATFORM_COMMISSION_PLATFORM_BPS: ${PLATFORM_COMMISSION_PLATFORM_BPS:-3000}

      # Cron
      CRON_SECRET: ${CRON_SECRET}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - web
      - internal

  # -------- Postgres 16 --------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # -------- Cron sidecar : appelle /api/cron/cleanup tous les jours à 3h --------
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c "
        apk add --no-cache curl tini >/dev/null;
        echo '0 3 * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/cleanup >/proc/1/fd/1 2>/proc/1/fd/2' > /etc/crontabs/root;
        exec /sbin/tini -- crond -f -d 8
      "
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  web:
  internal:
