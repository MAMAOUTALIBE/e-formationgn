# E-FormationGN — stack de PRODUCTION (VPS Hostinger).
#
# Ce fichier est la source de vérité du déploiement. Sur le VPS il vit dans
# /docker/e-formationgn/docker-compose.yml, à côté d'un .env (secrets, non commité).
#
# L'image n'est PAS buildée ici : elle est construite sur le Mac et poussée sur
# Docker Hub (`./scripts/deploy.sh`). Le VPS ne fait que `docker compose pull`.
# Procédure complète : voir REDEPLOY.md.

name: eformationgn

services:
  # -------- PostgreSQL 16 --------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # -------- Application Next.js --------
  # Image tirée de Docker Hub. nginx tourne sur l'hôte et relaie le trafic
  # HTTPS vers 127.0.0.1:3300 ; le port applicatif n'est jamais exposé sur
  # l'interface publique du VPS.
  app:
    image: bahm2062/e-formationgn:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3300:3000"
    # Persiste les fichiers uploadés sur disque (couvertures, vidéos de leçon,
    # avatars) quand Cloudflare R2 n'est PAS configuré — sinon ils sont perdus
    # à chaque `docker compose up -d`. Inutile si R2 est configuré (les uploads
    # vont alors sur R2), mais sert de filet de sécurité.
    volumes:
      - app_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - internal

  # -------- Cron sidecar --------
  # Tâches planifiées, toutes protégées par le Bearer CRON_SECRET (les routes
  # renvoient 401 sans). CRON_SECRET DOIT être présent dans le .env du VPS.
  #   - process-webhooks (10 min) : rejoue les webhooks PSP non traités
  #   - reconcile-orders (15 min) : réconcilie les commandes PENDING (webhook
  #     perdu/tardif → l'élève a payé mais n'a pas accès → corrigé ici)
  #   - cleanup (3h du matin) : purge des données expirées
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c "
        apk add --no-cache curl tini >/dev/null;
        {
          echo '*/10 * * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/process-webhooks >/proc/1/fd/1 2>/proc/1/fd/2';
          echo '*/15 * * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/reconcile-orders >/proc/1/fd/1 2>/proc/1/fd/2';
          echo '0 3 * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/cleanup >/proc/1/fd/1 2>/proc/1/fd/2';
        } > /etc/crontabs/root;
        exec /sbin/tini -- crond -f -d 8
      "
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  db_data:
  app_uploads:

networks:
  internal:
