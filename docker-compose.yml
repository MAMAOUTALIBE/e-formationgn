# E-FormationGN — stack de PRODUCTION (VPS Hostinger).
#
# Ce fichier est la source de vérité du déploiement. Sur le VPS il vit dans
# /docker/e-formationgn/docker-compose.yml, à côté d'un .env (secrets, non commité).
#
# L'image n'est PAS buildée ici : elle est construite sur le Mac et poussée sur
# Docker Hub (`./scripts/deploy.sh`). Le VPS ne fait que `docker compose pull`.
# Procédure complète : voir REDEPLOY.md.

name: eformationgn

services:
  # -------- PostgreSQL 16 --------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # -------- Application Next.js --------
  # Image tirée de Docker Hub. Routée par le Traefik mutualisé du VPS via les labels.
  app:
    image: bahm2062/e-formationgn:latest
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=eformationgn_internal"
      - "traefik.http.routers.eformationgn.rule=Host(`gandal.org`) || Host(`www.gandal.org`)"
      - "traefik.http.routers.eformationgn.entrypoints=websecure"
      - "traefik.http.routers.eformationgn.tls.certresolver=letsencrypt"
      - "traefik.http.services.eformationgn.loadbalancer.server.port=3000"
    networks:
      - internal

  # -------- Cron sidecar : /api/cron/cleanup tous les jours à 3h --------
  cron:
    image: alpine:3.20
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET}
    command: >
      sh -c "
        apk add --no-cache curl tini >/dev/null;
        echo '0 3 * * * curl -fsS -H \"Authorization: Bearer $$CRON_SECRET\" http://app:3000/api/cron/cleanup >/proc/1/fd/1 2>/proc/1/fd/2' > /etc/crontabs/root;
        exec /sbin/tini -- crond -f -d 8
      "
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
